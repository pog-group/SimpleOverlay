<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline';" />
  <title></title>
  <style>
    :root {
      --bg: #1a1a2e;
      --surface: #16213e;
      --surface-2: #12192e;
      --border: #34385c;
      --text: #e6e8f0;
      --muted: #9aa3bd;
      --faint: #7d86a3;
      --accent: #4a90d9;
      --accent-hover: #357abd;
      --star: #f5c542;
      --on: #3ecf8e;
      --idle: #f0b429;
      --warn: #ff6b6b;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      background: var(--bg);
      color: var(--text);
      padding: 12px 16px 10px;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

    body { position: relative; }
    .app-header { flex-shrink: 0; height: 48px; display: flex; justify-content: center; }
    .app-header img { height: 100%; width: auto; display: block; }

    label, .label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--muted);
      display: block;
      margin-bottom: 4px;
    }

    input[type="text"], select {
      width: 100%;
      padding: 7px 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s;
    }
    input[type="text"]:focus, select:focus { border-color: var(--accent); }
    select option, select optgroup { background: var(--surface); color: var(--text); }

    .row { display: flex; gap: 8px; align-items: center; }
    .row > input, .row > select { flex: 1; min-width: 0; }
    .section { display: flex; flex-direction: column; gap: 4px; min-height: 0; flex-shrink: 0; }
    .section.grow { flex: 1; flex-shrink: 1; }

    button {
      padding: 7px 12px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      font-family: inherit;
      transition: background 0.15s, transform 0.08s;
      white-space: nowrap;
    }
    button:active { transform: scale(0.97); }

    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-hover); }

    .btn-ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 6px 10px;
    }
    .btn-ghost:hover { background: var(--border); color: #fff; }
    .btn-ghost.saved { color: var(--star); border-color: var(--star); }
    .btn-ghost.saved:hover { background: rgba(245, 197, 66, 0.15); color: var(--star); }

    /* Overlay on/off: blue to show, neutral to hide. Hiding is not destructive. */
    .btn-toggle {
      padding: 10px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 8px;
      background: var(--accent);
      border: 1px solid transparent;
      color: #fff;
    }
    .btn-toggle:hover { background: var(--accent-hover); }
    .btn-toggle.active { background: transparent; border: 1px solid var(--accent); color: var(--accent); }
    .btn-toggle.active:hover { background: rgba(74, 144, 217, 0.12); }

    .btn-mode { background: #6c3483; color: #fff; font-weight: 600; flex: 1; padding: 8px 12px; }
    .btn-mode:hover { filter: brightness(1.15); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    button:disabled:active { transform: none; }
    .btn-mode.active { background: #c0392b; }

    kbd {
      font-family: inherit;
      font-size: 10px;
      font-weight: 500;
      padding: 1px 5px;
      margin-left: 6px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.14);
      vertical-align: 1px;
    }

    .btn-update {
      position: absolute;
      top: 14px;
      right: 16px;
      background: var(--star);
      color: #1a1a2e;
      font-weight: 600;
      padding: 6px 12px;
      z-index: 2;
    }
    .btn-update:hover { filter: brightness(1.08); }
    .btn-update:disabled { opacity: 0.7; cursor: progress; }

    .btn-toggle .sub { font-size: 12px; font-weight: 500; margin-left: 8px; }
    .btn-toggle .sub[data-tone="idle"] { color: var(--idle); }
    .btn-toggle .sub[data-tone="warn"] { color: var(--warn); }

    .check { display: flex; align-items: center; gap: 8px; cursor: pointer; color: var(--text); font-size: 12px; text-transform: none; letter-spacing: normal; margin-bottom: 0; }
    .check input { accent-color: var(--accent); width: 14px; height: 14px; }

    [hidden] { display: none !important; }

    /* ── Library ── */
    .section-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-shrink: 0; }

    .segmented { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
    .segmented button {
      border-radius: 0;
      background: transparent;
      color: var(--muted);
      padding: 5px 12px;
      font-size: 12px;
    }
    .segmented button + button { border-left: 1px solid var(--border); }
    .segmented button:hover { color: #fff; }
    .segmented button[aria-pressed="true"] { background: var(--border); color: #fff; }

    .list-box {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow-y: auto;
      flex: 1;
      min-height: 0;
    }
    .list-box::-webkit-scrollbar { width: 6px; }
    .list-box::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .empty { padding: 20px; text-align: center; color: var(--faint); font-size: 12px; }

    .item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 2px 6px 2px 4px;
      border-bottom: 1px solid #1f2342;
      cursor: pointer;
      transition: background 0.1s;
    }
    .item:last-child { border-bottom: none; }
    .item:hover { background: #1a2540; }
    .item.current { box-shadow: inset 3px 0 0 var(--accent); background: #18233f; }

    .item-url {
      flex: 1;
      font-size: 12px;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding: 5px 0;
    }
    .item.is-history .item-url { color: var(--muted); }

    .star {
      background: transparent;
      color: var(--faint);
      font-size: 15px;
      line-height: 1;
      padding: 4px 6px;
      flex-shrink: 0;
    }
    .star:hover { color: var(--star); }

    .remove {
      background: transparent;
      color: var(--faint);
      font-size: 11px;
      line-height: 1;
      padding: 5px 6px;
      flex-shrink: 0;
    }
    .remove:hover { color: var(--warn); }
    .star.on { color: var(--star); }

    .field-error { color: var(--warn); font-size: 12px; }

    .footer { flex-shrink: 0; font-size: 11px; color: var(--faint); text-align: center; }
    .footer kbd { margin-left: 2px; margin-right: 4px; }
  </style>
</head>
<body>
  <div class="app-header">
    <img src="../assets/icon_banner.svg" alt="Simple Overlay" draggable="false" />
  </div>

  <button class="btn-update" id="updateBtn" hidden></button>

  <!-- URL -->
  <div class="section">
    <label for="urlInput">URL</label>
    <div class="row">
      <input type="text" id="urlInput" placeholder="https://example.com" />
      <button class="btn-ghost" id="saveBtn" title="Save to favorites" aria-label="Save to favorites">★</button>
      <button class="btn-primary" id="loadBtn">Load</button>
    </div>
    <div class="field-error" id="urlError" role="alert" hidden></div>
  </div>

  <!-- Target: a display or a window to follow -->
  <div class="section">
    <label for="targetSelect">Show on</label>
    <div class="row">
      <select id="targetSelect"></select>
      <button class="btn-ghost" id="refreshWinBtn" title="Refresh window list" aria-label="Refresh window list" hidden>↻</button>
    </div>
    <label class="check" id="hideUnfocusedRow" hidden>
      <input type="checkbox" id="hideUnfocused" />
      Hide when that window is not focused
    </label>
  </div>

  <!-- Overlay controls -->
  <div class="row">
    <button class="btn-toggle" id="toggleBtn" style="flex:3">Show Overlay</button>
    <button class="btn-ghost" id="reloadBtn" style="flex:1" title="Reload the page">↺ Reload</button>
    <button class="btn-ghost" id="soundBtn" aria-pressed="false"></button>
  </div>

  <div class="row">
    <button class="btn-mode" id="interactBtn" title="Click and type in the overlay page">Interact</button>
    <button class="btn-mode" id="editBtn" title="Interact with the overlay in fullscreen, then snap back onto the window" hidden>Interact in fullscreen</button>
  </div>

  <!-- Library: saved favorites + recent history in one list -->
  <div class="section grow">
    <div class="section-header">
      <div class="segmented" role="group" aria-label="Filter">
        <button id="tabRecent" aria-pressed="true">Recent</button>
        <button id="tabSaved" aria-pressed="false">★ Saved</button>
      </div>
      <button class="btn-ghost" id="clearHistBtn">Clear history</button>
    </div>
    <div class="list-box" id="list"></div>
  </div>

  <div class="footer"><kbd>Ctrl+Alt+O</kbd>show/hide<kbd>Ctrl+Alt+I</kbd>interact</div>

  <script>
    const $ = (id) => document.getElementById(id);
    const urlInput = $('urlInput');
    const targetSelect = $('targetSelect');
    const refreshWinBtn = $('refreshWinBtn');
    const hideUnfocusedRow = $('hideUnfocusedRow');
    const hideUnfocused = $('hideUnfocused');
    const toggleBtn = $('toggleBtn');
    const updateBtn = $('updateBtn');
    const interactBtn = $('interactBtn');
    const editBtn = $('editBtn');
    const listEl = $('list');
    const tabRecent = $('tabRecent');
    const tabSaved = $('tabSaved');
    const clearHistBtn = $('clearHistBtn');

    let store = { saved: [], history: [] };
    let tab = 'recent';
    let currentUrl = '';
    let overlayOn = false;
    let interactMode = null;
    let pageReady = false; // the overlay has a page that loaded
    let status = { tone: 'off', text: '' };
    let canFollow = false;
    let target = { kind: 'display', index: 0 };
    let displays = [];
    let windowList = [];

    // ── Target select ──
    function renderTargets() {
      targetSelect.innerHTML = '';
      const dGroup = document.createElement('optgroup');
      dGroup.label = 'Displays';
      displays.forEach(d => {
        const opt = document.createElement('option');
        opt.value = 'd:' + d.id;
        opt.textContent = d.isPrimary ? d.label + ' (Primary)' : d.label;
        dGroup.appendChild(opt);
      });
      targetSelect.appendChild(dGroup);

      if (canFollow) {
        const wGroup = document.createElement('optgroup');
        wGroup.label = 'Follow a window';
        const known = new Set(windowList.map(w => w.hwnd));
        const entries = windowList.slice();
        // Keep the current target selectable even if it vanished from the list.
        if (target.kind === 'window' && !known.has(String(target.hwnd))) {
          entries.push({ hwnd: String(target.hwnd), title: target.title, proc: target.proc || '' });
        }
        const byName = (a, b) => (a.proc || '').localeCompare(b.proc || '', undefined, { sensitivity: 'base' })
          || a.title.localeCompare(b.title, undefined, { sensitivity: 'base' });
        entries.sort(byName);
        entries.forEach(w => {
          const opt = document.createElement('option');
          opt.value = 'w:' + w.hwnd;
          opt.dataset.title = w.title;
          opt.dataset.proc = w.proc || '';
          opt.textContent = w.proc ? `${w.proc} — ${w.title}` : w.title;
          wGroup.appendChild(opt);
        });
        targetSelect.appendChild(wGroup);
      }

      targetSelect.value = target.kind === 'window' ? 'w:' + target.hwnd : 'd:' + target.index;
      const following = target.kind === 'window';
      hideUnfocusedRow.hidden = !following;
      editBtn.hidden = !following;
    }

    // Refreshes can be triggered rapidly (button spam, focus changes). Only one runs at a time and
    // any requests that arrive meanwhile collapse into a single follow-up run.
    let refreshing = false;
    let refreshQueued = false;
    let pendingList = null;

    async function refreshWindows() {
      if (!canFollow) return;
      if (refreshing) { refreshQueued = true; return; }
      refreshing = true;
      try {
        applyWindowList(await window.api.listWindows());
      } finally {
        refreshing = false;
        if (refreshQueued) { refreshQueued = false; refreshWindows(); }
      }
    }

    // Rebuilding the options while the dropdown is open would close it or change the highlighted entry,
    // so a list that arrives meanwhile waits until the select loses focus.
    function applyWindowList(list) {
      if (document.activeElement === targetSelect) { pendingList = list; return; }
      windowList = list;
      renderTargets();
    }

    targetSelect.addEventListener('blur', () => {
      if (!pendingList) return;
      windowList = pendingList;
      pendingList = null;
      renderTargets();
    });

    targetSelect.onchange = () => {
      const opt = targetSelect.selectedOptions[0];
      if (targetSelect.value.startsWith('w:')) {
        target = { kind: 'window', hwnd: targetSelect.value.slice(2), title: opt.dataset.title || opt.textContent, proc: opt.dataset.proc || '' };
      } else {
        target = { kind: 'display', index: parseInt(targetSelect.value.slice(2)) || 0 };
      }
      renderTargets();
      window.api.setTarget(target);
      updateEnabled();
    };

    refreshWinBtn.onclick = refreshWindows;
    hideUnfocused.onchange = () => window.api.setHideUnfocused(hideUnfocused.checked);

    // ── Library list ──
    function makeItem(url, isSaved, removable) {
      const row = document.createElement('div');
      row.className = 'item' + (isSaved ? '' : ' is-history') + (url === currentUrl ? ' current' : '');
      row.tabIndex = 0;

      const star = document.createElement('button');
      star.className = 'star' + (isSaved ? ' on' : '');
      star.textContent = isSaved ? '★' : '☆';
      star.title = isSaved ? 'Remove from favorites' : 'Add to favorites';
      star.setAttribute('aria-label', star.title);
      star.onclick = (e) => {
        e.stopPropagation();
        if (isSaved) window.api.removeSaved(url);
        else window.api.saveUrl(url);
      };

      const urlEl = document.createElement('div');
      urlEl.className = 'item-url';
      urlEl.textContent = url;
      urlEl.title = url;

      row.appendChild(star);
      row.appendChild(urlEl);
      if (removable) {
        const rm = document.createElement('button');
        rm.className = 'remove';
        rm.textContent = '✕';
        rm.title = 'Remove from recent';
        rm.setAttribute('aria-label', rm.title);
        rm.onclick = (e) => { e.stopPropagation(); window.api.removeHistory(url); };
        row.appendChild(rm);
      }
      row.onclick = () => loadUrl(url);
      row.onkeydown = (e) => { if (e.key === 'Enter' && e.target === row) loadUrl(url); };
      return row;
    }

    function renderList() {
      updateSaveBtn();
      const saved = store.saved || [];
      const recent = store.history || [];
      const savedSet = new Set(saved);
      const showSaved = tab === 'saved';
      const items = showSaved ? saved : recent;

      tabRecent.textContent = `Recent (${recent.length})`;
      tabSaved.textContent = `★ Saved (${saved.length})`;
      tabRecent.setAttribute('aria-pressed', !showSaved);
      tabSaved.setAttribute('aria-pressed', showSaved);
      // visibility (not hidden) so the header keeps its height and nothing shifts between tabs
      clearHistBtn.style.visibility = showSaved || !recent.length ? 'hidden' : 'visible';

      listEl.innerHTML = '';
      if (!items.length) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = showSaved
          ? 'No favorites yet. Click ☆ on any URL to save it.'
          : 'Nothing here yet. Load a URL to get started.';
        listEl.appendChild(empty);
        return;
      }
      items.forEach(u => listEl.appendChild(makeItem(u, savedSet.has(u), !showSaved)));
    }

    tabRecent.onclick = () => { tab = 'recent'; renderList(); };
    tabSaved.onclick = () => { tab = 'saved'; renderList(); };
    clearHistBtn.onclick = () => window.api.clearHistory();

    const urlError = $('urlError');
    function showUrlError(message) {
      urlError.textContent = message;
      urlError.hidden = !message;
    }

    async function loadUrl(url) {
      const result = await window.api.setUrl(url, true);
      if (!result.ok) { showUrlError(result.error); return; }
      showUrlError('');
      urlInput.value = result.url; // the cleaned-up address (https:// added, host lowercased)
      currentUrl = result.url;
      pageReady = true; // optimistic; the main process reports a failed load
      updateSaveBtn();
      updateEnabled();
      renderList();
    }

    function submitUrl() {
      const url = urlInput.value.trim();
      if (!url) { urlInput.focus(); return; }
      loadUrl(url);
    }

    $('loadBtn').onclick = submitUrl;
    urlInput.onkeydown = (e) => { if (e.key === 'Enter') submitUrl(); };
    const saveBtn = $('saveBtn');
    function updateSaveBtn() {
      const saved = (store.saved || []).includes(urlInput.value.trim());
      saveBtn.classList.toggle('saved', saved);
      saveBtn.textContent = saved ? '★' : '☆';
      saveBtn.title = saved ? 'Remove from favorites' : 'Save to favorites';
      saveBtn.setAttribute('aria-label', saveBtn.title);
    }
    urlInput.addEventListener('input', () => { updateSaveBtn(); updateEnabled(); showUrlError(''); });
    saveBtn.onclick = async () => {
      const url = urlInput.value.trim();
      if (!url) return;
      if ((store.saved || []).includes(url)) { window.api.removeSaved(url); return; }
      const result = await window.api.saveUrl(url);
      if (!result.ok) showUrlError(result.error);
    };

    // ── Overlay controls ──
    // The Show/Hide button doubles as the status display: when the overlay is on but
    // hidden (target not focused, minimized, closed), the reason shows beside the label.
    function renderToggle() {
      const reason = overlayOn && (status.tone === 'idle' || status.tone === 'warn') ? status.short : '';
      toggleBtn.innerHTML = (overlayOn ? 'Hide Overlay' : 'Show Overlay')
        + (reason ? `<span class="sub" data-tone="${status.tone}">· ${reason}</span>` : '')
        + '<kbd>Ctrl+Alt+O</kbd>';
      toggleBtn.title = reason ? status.text : '';
      toggleBtn.classList.toggle('active', overlayOn);
      updateEnabled();
    }

    // Gray out whatever can't work: needs a page that loaded and a non-empty URL field.
    // Once the overlay is on, Hide stays available.
    function updateEnabled() {
      const canShow = pageReady && urlInput.value.trim() !== '';
      const blocked = !canShow && !overlayOn;
      toggleBtn.disabled = blocked;
      $('reloadBtn').disabled = !pageReady; // nothing to reload until a page has loaded
      interactBtn.disabled = blocked;
      editBtn.disabled = blocked;
      if (blocked) {
        const why = !urlInput.value.trim() ? 'Enter a URL first'
          : pageReady ? 'Load a URL first' : 'Load a URL first (the last one failed to load)';
        toggleBtn.title = interactBtn.title = editBtn.title = why;
      } else {
        interactBtn.title = 'Click and type in the overlay page';
        editBtn.title = 'Interact with the overlay in fullscreen, then snap back onto the window';
      }
      // Following a window that isn't showing: plain Interact would click an invisible overlay.
      // (Interact in fullscreen still works, and a running Interact can always be stopped.)
      const followHidden = target.kind === 'window' && overlayOn && !status.visible && interactMode !== 'interact';
      if (followHidden) {
        interactBtn.disabled = true;
        interactBtn.title = 'The followed window is not visible, so there is nothing to click. Use Interact in fullscreen.';
      }
    }

    function setOverlayState(visible) {
      overlayOn = visible;
      renderToggle();
    }

    function setInteractState(mode) {
      interactMode = mode;
      interactBtn.textContent = mode === 'interact' ? 'Stop Interacting' : 'Interact';
      interactBtn.classList.toggle('active', mode === 'interact');
      editBtn.textContent = mode === 'edit' ? 'Stop Interacting' : 'Interact in fullscreen';
      editBtn.classList.toggle('active', mode === 'edit');
      updateEnabled();
    }

    function setStatus(s) {
      status = s;
      renderToggle();
      updateEnabled();
    }

    function setUpdate(u) {
      updateBtn.hidden = !u;
      if (!u) return;
      const busy = u.phase === 'downloading';
      updateBtn.disabled = busy;
      updateBtn.textContent = busy ? 'Updating…' : 'Update available';
      updateBtn.title = busy ? `Downloading ${u.version}, the app will restart`
        : u.canAutoInstall ? `Install ${u.version} and restart`
        : `Open the release page to download ${u.version}`;
    }
    updateBtn.onclick = () => window.api.installUpdate();

    toggleBtn.onclick = () => overlayOn ? window.api.hideOverlay() : window.api.showOverlay();
    $('reloadBtn').onclick = () => window.api.reloadOverlay();

    // The overlay page is silent by default; this lets its audio through.
    const soundBtn = $('soundBtn');
    function setMuted(muted) {
      soundBtn.dataset.muted = muted;
      soundBtn.textContent = muted ? '🔇' : '🔊';
      soundBtn.title = muted ? 'Overlay sound is off. Click to turn it on' : 'Overlay sound is on. Click to mute';
      soundBtn.setAttribute('aria-label', soundBtn.title);
      soundBtn.setAttribute('aria-pressed', !muted);
    }
    soundBtn.onclick = () => {
      const muted = soundBtn.dataset.muted !== 'true';
      setMuted(muted);
      window.api.setAudioMuted(muted);
    };

    function toggleMode(mode) {
      if (interactMode === mode) window.api.stopInteractOverlay();
      else window.api.interactOverlay(mode);
    }
    interactBtn.onclick = () => toggleMode('interact');
    editBtn.onclick = () => toggleMode('edit');

    async function init() {
      const [d, s, state] = await Promise.all([window.api.getDisplays(), window.api.getStore(), window.api.getState()]);
      displays = d;
      store = s;
      canFollow = state.canFollow;
      target = state.target;
      hideUnfocused.checked = state.hideWhenUnfocused;
      refreshWinBtn.hidden = !canFollow;
      renderTargets();
      renderList();
      pageReady = state.canShow;
      setMuted(state.audioMuted);
      setOverlayState(state.overlayOn);
      setInteractState(state.interactMode);
      setStatus(state.status);

      window.api.onStoreUpdated((next) => { store = next; renderList(); });
      window.api.onOverlayState(setOverlayState);
      window.api.onInteractState(setInteractState);
      window.api.onStatus(setStatus);
      window.api.onTarget((t) => { target = t; renderTargets(); }); // the followed window came back under a new handle
      window.api.onUpdateState(setUpdate);
      setUpdate(state.update);
      window.api.onCanShow((ok) => { pageReady = ok; updateEnabled(); });

      // Coming back to the panel is when you pick a window, so refresh then.
      window.addEventListener('focus', refreshWindows);
      refreshWindows();
    }

    init();
  </script>
</body>
</html>
